<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 295" fill="none">
  <defs>

    <!-- Glow radial cálido — elemento dominante -->
    <radialGradient id="glow" cx="50%" cy="62%" r="48%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#d97215" stop-opacity="0.82"/>
      <stop offset="28%"  stop-color="#b85010" stop-opacity="0.52"/>
      <stop offset="60%"  stop-color="#7a2c08" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3a0e00" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente llama izquierda -->
    <linearGradient id="gradL" x1="45%" y1="100%" x2="53%" y2="0%">
      <stop offset="0%"   stop-color="#c05510"/>
      <stop offset="38%"  stop-color="#ed8820"/>
      <stop offset="72%"  stop-color="#f8aa42"/>
      <stop offset="100%" stop-color="#fece7a" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Gradiente llama derecha -->
    <linearGradient id="gradR" x1="53%" y1="100%" x2="45%" y2="0%">
      <stop offset="0%"   stop-color="#c85a15"/>
      <stop offset="38%"  stop-color="#f09030"/>
      <stop offset="72%"  stop-color="#faaf50"/>
      <stop offset="100%" stop-color="#fdd888" stop-opacity="0.80"/>
    </linearGradient>

    <!-- Gradiente arcos — borgoña oscuro -->
    <linearGradient id="gradPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1c0404"/>
      <stop offset="50%"  stop-color="#5c1010"/>
      <stop offset="100%" stop-color="#1c0404"/>
    </linearGradient>

    <!-- Suave glow sobre las llamas -->
    <filter id="fg" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ── GLOW AMBIENTAL ── grande, radial, cálido -->
  <ellipse cx="150" cy="178" rx="142" ry="118" fill="url(#glow)"/>

  <!-- ══════════════════════════════════
       LLAMA IZQUIERDA
       S-curve pronunciada hacia la izquierda
       Base compartida al centro, punta arriba-izq
  ══════════════════════════════════ -->
  <path d="
    M 141 187
    C 119 178, 95 160, 99 136
    C 102 116, 115 97, 120 77
    C 122 66, 121 57, 122 51
    C 129 64, 135 84, 132 107
    C 130 126, 141 144, 142 164
    C 143 176, 142 184, 141 187
    Z"
    fill="url(#gradL)" filter="url(#fg)"/>

  <!-- ══════════════════════════════════
       LLAMA DERECHA
       S-curve pronunciada hacia la derecha
       Ligeramente más alta, más estrecha
  ══════════════════════════════════ -->
  <path d="
    M 153 187
    C 174 178, 197 160, 195 136
    C 192 116, 180 97, 175 77
    C 172 66, 173 57, 172 51
    C 164 64, 159 84, 162 107
    C 164 126, 153 144, 151 164
    C 150 176, 152 184, 153 187
    Z"
    fill="url(#gradR)" filter="url(#fg)"/>

  <!-- ══════════════════════════════════
       ARCOS DEL PLATO — anchos, borgoña
       Tres concéntricos, separados por pocos px
  ══════════════════════════════════ -->

  <!-- Arco exterior -->
  <path d="M 42 196 Q 150 238 258 196"
    stroke="url(#gradPlate)" stroke-width="11"
    stroke-linecap="round" fill="none"/>

  <!-- Arco medio -->
  <path d="M 67 206 Q 150 244 233 206"
    stroke="url(#gradPlate)" stroke-width="8"
    stroke-linecap="round" fill="none"/>

  <!-- Arco interior -->
  <path d="M 93 215 Q 150 250 207 215"
    stroke="url(#gradPlate)" stroke-width="6"
    stroke-linecap="round" fill="none"/>

</svg>

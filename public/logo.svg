<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 295" fill="none">
  <defs>

    <!-- Glow radial grande — elemento dominante del original -->
    <radialGradient id="glow" cx="50%" cy="62%" r="50%">
      <stop offset="0%"   stop-color="#d87015" stop-opacity="0.82"/>
      <stop offset="28%"  stop-color="#b04e10" stop-opacity="0.52"/>
      <stop offset="62%"  stop-color="#7a2c08" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3a0e00" stop-opacity="0"/>
    </radialGradient>

    <!-- Llama izquierda: naranja cálido → ámbar suave en punta -->
    <linearGradient id="gradL" x1="44%" y1="100%" x2="53%" y2="0%">
      <stop offset="0%"   stop-color="#c05512"/>
      <stop offset="38%"  stop-color="#ed8c22"/>
      <stop offset="74%"  stop-color="#f8ac42"/>
      <stop offset="100%" stop-color="#fece7c" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Llama derecha: tono levemente más cálido -->
    <linearGradient id="gradR" x1="54%" y1="100%" x2="46%" y2="0%">
      <stop offset="0%"   stop-color="#c85c16"/>
      <stop offset="38%"  stop-color="#f09232"/>
      <stop offset="74%"  stop-color="#fab050"/>
      <stop offset="100%" stop-color="#fdd884" stop-opacity="0.80"/>
    </linearGradient>

    <!-- Arcos del plato: borgoña oscuro -->
    <linearGradient id="gradPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1a0404"/>
      <stop offset="50%"  stop-color="#5c1010"/>
      <stop offset="100%" stop-color="#1a0404"/>
    </linearGradient>

    <!-- Halo suave sobre las llamas (blur+merge) -->
    <filter id="fg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ── GLOW AMBIENTAL ── gran elipse radial cálida (fondo) -->
  <ellipse cx="150" cy="176" rx="140" ry="114" fill="url(#glow)"/>

  <!-- ══════════════════════════════════
       LLAMA IZQUIERDA
       Wisp en S: base central, cuerpo curva a la izquierda,
       punta sube y vuelve levemente hacia la derecha
  ══════════════════════════════════ -->
  <path d="
    M 144 184
    C 113 175,  92 155,  99 135
    C 104 118,  113  98, 118  78
    C 120  67,  120  60, 121  55
    C 129  69,  134  97, 131 121
    C 129 141,  138 163, 141 182
    Z"
    fill="url(#gradL)" filter="url(#fg)"/>

  <!-- ══════════════════════════════════
       LLAMA DERECHA
       Wisp en S: base central, cuerpo curva a la derecha,
       punta ligeramente más alta, curva vuelve a la izquierda
  ══════════════════════════════════ -->
  <path d="
    M 149 184
    C 178 175, 198 155, 192 135
    C 187 118, 178  98, 173  78
    C 171  67, 171  60, 170  54
    C 162  68, 157  96, 160 121
    C 162 141, 153 163, 150 182
    Z"
    fill="url(#gradR)" filter="url(#fg)"/>

  <!-- ══════════════════════════════════
       ARCOS DEL PLATO — tres anchos, borgoña
       Extienden bastante más allá del ancho de las llamas
  ══════════════════════════════════ -->

  <!-- Arco exterior (más ancho) -->
  <path d="M 40 193 Q 150 238 260 193"
    stroke="url(#gradPlate)" stroke-width="11.5"
    stroke-linecap="round" fill="none"/>

  <!-- Arco medio -->
  <path d="M 66 203 Q 150 244 234 203"
    stroke="url(#gradPlate)" stroke-width="8.5"
    stroke-linecap="round" fill="none"/>

  <!-- Arco interior (más estrecho) -->
  <path d="M 93 212 Q 150 249 207 212"
    stroke="url(#gradPlate)" stroke-width="6"
    stroke-linecap="round" fill="none"/>

</svg>

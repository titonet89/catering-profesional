<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 28 270 232" fill="none">
  <defs>

    <!-- Glow ambiental: ámbar cálido suave, más armonioso con la paleta gold del sitio -->
    <radialGradient id="glow" cx="50%" cy="64%" r="50%">
      <stop offset="0%"   stop-color="#c46010" stop-opacity="0.76"/>
      <stop offset="26%"  stop-color="#9e4008" stop-opacity="0.46"/>
      <stop offset="60%"  stop-color="#6e2808" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#380e00" stop-opacity="0"/>
    </radialGradient>

    <!-- Llama izquierda: naranja-ámbar suave → punta dorada -->
    <linearGradient id="gradL" x1="44%" y1="100%" x2="53%" y2="0%">
      <stop offset="0%"   stop-color="#ae5610"/>
      <stop offset="36%"  stop-color="#d88420"/>
      <stop offset="72%"  stop-color="#ecaa3c"/>
      <stop offset="100%" stop-color="#f5c460" stop-opacity="0.84"/>
    </linearGradient>

    <!-- Llama derecha: tonos levemente más cálidos -->
    <linearGradient id="gradR" x1="54%" y1="100%" x2="46%" y2="0%">
      <stop offset="0%"   stop-color="#b85e16"/>
      <stop offset="36%"  stop-color="#e08c2a"/>
      <stop offset="72%"  stop-color="#f0ae48"/>
      <stop offset="100%" stop-color="#f8cc6c" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Arcos: borgoña oscuro refinado -->
    <linearGradient id="gradPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#180404"/>
      <stop offset="50%"  stop-color="#581212"/>
      <stop offset="100%" stop-color="#180404"/>
    </linearGradient>

    <!-- Halo suave sobre las llamas -->
    <filter id="fg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- GLOW radial cálido y difuso -->
  <ellipse cx="150" cy="176" rx="140" ry="114" fill="url(#glow)"/>

  <!-- LLAMA IZQUIERDA — wisp en S, curva hacia la izquierda -->
  <path d="
    M 144 184
    C 113 175,  92 155,  99 135
    C 104 118, 113  98, 118  78
    C 120  67, 120  60, 121  55
    C 129  69, 134  97, 131 121
    C 129 141, 138 163, 141 182
    Z"
    fill="url(#gradL)" filter="url(#fg)"/>

  <!-- LLAMA DERECHA — wisp en S, curva hacia la derecha -->
  <path d="
    M 149 184
    C 178 175, 198 155, 192 135
    C 187 118, 178  98, 173  78
    C 171  67, 171  60, 170  54
    C 162  68, 157  96, 160 121
    C 162 141, 153 163, 150 182
    Z"
    fill="url(#gradR)" filter="url(#fg)"/>

  <!-- ARCOS DEL PLATO — anchos, tres concéntricos, borgoña -->
  <path d="M 40 193 Q 150 238 260 193"
    stroke="url(#gradPlate)" stroke-width="11.5"
    stroke-linecap="round" fill="none"/>
  <path d="M 66 203 Q 150 244 234 203"
    stroke="url(#gradPlate)" stroke-width="8.5"
    stroke-linecap="round" fill="none"/>
  <path d="M 93 212 Q 150 249 207 212"
    stroke="url(#gradPlate)" stroke-width="6"
    stroke-linecap="round" fill="none"/>

</svg>

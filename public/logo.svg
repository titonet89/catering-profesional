<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 295" fill="none">
  <defs>

    <!-- Halo de luz ambiental difuso -->
    <filter id="halo" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="28"/>
    </filter>

    <!-- Brillo suave sobre las llamas -->
    <filter id="flameGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradiente llama izquierda: naranja cálido → dorado suave arriba -->
    <linearGradient id="gradL" x1="40%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%"   stop-color="#b86010"/>
      <stop offset="30%"  stop-color="#e08c24"/>
      <stop offset="65%"  stop-color="#f0b040"/>
      <stop offset="100%" stop-color="#fad878" stop-opacity="0.78"/>
    </linearGradient>

    <!-- Gradiente llama derecha: tono más cálido y luminoso -->
    <linearGradient id="gradR" x1="35%" y1="100%" x2="65%" y2="0%">
      <stop offset="0%"   stop-color="#c06818"/>
      <stop offset="35%"  stop-color="#e89c2c"/>
      <stop offset="70%"  stop-color="#f5bc48"/>
      <stop offset="100%" stop-color="#fde494" stop-opacity="0.72"/>
    </linearGradient>

    <!-- Gradiente arcos del plato: borgoña oscuro -->
    <linearGradient id="gradPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3e0e0e"/>
      <stop offset="45%"  stop-color="#7a1c1c"/>
      <stop offset="100%" stop-color="#3e0e0e"/>
    </linearGradient>

  </defs>

  <!-- ── Halo ambiental cálido (fondo, completamente desenfocado) ── -->
  <ellipse cx="148" cy="150" rx="72" ry="84"
           fill="#d07010" filter="url(#halo)" opacity="0.52"/>

  <!-- ══════════════════════════════════
       LLAMA IZQUIERDA
       Curva: base central-izquierda, se abre hacia la izquierda
       al subir, luego vuelve al centro en punta
  ══════════════════════════════════ -->
  <path d="
    M 130 214
    C 113 198,  86 176,  88 153
    C  90 130, 108 118, 114  97
    C 118  80, 112  64, 114  52
    C 122  65, 128  82, 126 100
    C 124 118, 140 134, 140 155
    C 140 177, 150 197, 148 214
    Z"
    fill="url(#gradL)"
    filter="url(#flameGlow)"/>

  <!-- Vena interna izquierda (da profundidad y organicidad) -->
  <path d="M 119 196 C 106 176, 95 155, 101 134 C 107 115, 116 106, 113 84"
        stroke="#f0a820" stroke-width="2" stroke-linecap="round"
        fill="none" opacity="0.45"/>

  <!-- ══════════════════════════════════
       LLAMA DERECHA
       Más alta y delgada, curva en S suave
  ══════════════════════════════════ -->
  <path d="
    M 148 214
    C 150 198, 163 180, 171 159
    C 179 138, 170 118, 163  97
    C 157  78, 160  62, 158  48
    C 151  62, 147  80, 152 100
    C 157 120, 147 140, 142 161
    C 137 181, 143 198, 148 214
    Z"
    fill="url(#gradR)"
    filter="url(#flameGlow)"/>

  <!-- Vena interna derecha -->
  <path d="M 155 200 C 165 180, 169 158, 162 138 C 155 120, 149 108, 153 86"
        stroke="#f5b83a" stroke-width="2" stroke-linecap="round"
        fill="none" opacity="0.42"/>

  <!-- ══════════════════════════════════
       ARCOS DEL PLATO — tres concéntricos
       Borgoña oscuro, strokeLinecap round
  ══════════════════════════════════ -->

  <!-- Arco exterior (más ancho y grueso) -->
  <path d="M 55 234 Q 150 268 245 234"
        stroke="url(#gradPlate)" stroke-width="8.5"
        stroke-linecap="round" fill="none"/>

  <!-- Arco medio -->
  <path d="M 80 243 Q 150 273 220 243"
        stroke="url(#gradPlate)" stroke-width="6.5"
        stroke-linecap="round" fill="none"/>

  <!-- Arco interior (más estrecho y fino) -->
  <path d="M 104 251 Q 150 276 196 251"
        stroke="url(#gradPlate)" stroke-width="5"
        stroke-linecap="round" fill="none"/>

</svg>
